<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/landing.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0A0A0A; }
  .card {
    position: fixed; inset: 0; overflow: hidden;
    background: #0A0A0A; color: #FAFAFA;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 58px 64px;
  }
  /* the drawing sits behind the type, bled off the right edge */
  .card .art {
    position: absolute; right: -130px; bottom: 6px;
    width: 600px; opacity: .5; pointer-events: none;
  }
  .card .art .car-art { animation: none !important; }
  .card .art .ca-body { stroke-dasharray: none !important; stroke-dashoffset: 0 !important;
                        animation: none !important; }
  .brand { display: flex; align-items: center; gap: 12px; position: relative; }
  .brand .mark {
    background: #FF3D00; color: #0A0A0A; font-family: 'Space Grotesk'; font-weight: 700;
    font-size: 26px; letter-spacing: -.02em; padding: 5px 11px 6px;
  }
  .brand .word {
    font-family: 'Space Grotesk'; font-weight: 700; font-size: 25px;
    letter-spacing: .01em; text-transform: uppercase;
  }
  .mid { position: relative; }
  .eyebrow {
    color: #FF3D00; font-size: 17px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; margin: 0 0 20px;
  }
  h1 {
    font-family: 'Space Grotesk'; font-weight: 700; margin: 0;
    font-size: 78px; line-height: .98; letter-spacing: -.035em; max-width: 720px;
  }
  h1 .rm { color: #FF3D00; }
  .incl {
    margin: 26px 0 0; padding: 0; list-style: none; display: flex; gap: 0;
    border: 1px solid #262626; max-width: 600px;
  }
  .incl li {
    flex: 1 1 0; min-width: 0; padding: 12px 4px; text-align: center;
    font-size: 14px; font-weight: 500; color: #9A9A9A;
    border-right: 1px solid #262626; white-space: nowrap;
  }
  .incl li:last-child { border-right: none; }
  .foot {
    position: relative; display: flex; align-items: baseline; gap: 16px;
    font-size: 19px; color: #9A9A9A;
  }
  .foot .dom { color: #FAFAFA; font-weight: 600; }
</style></head>
<!-- HOW TO REGENERATE img/share-card.png
     1. serve the repo root over http (the card pulls ../css/landing.css)
     2. open this file, wait for the webfonts, screenshot the .card element
        at its natural 1200x630 -- any headless shot or a browser devtools
        "capture node screenshot" will do
     3. save over img/share-card.png and update og:image:width/height in
        index.html if the size changes
     The car drawing is pasted in by tools/build-car-art.js, so re-run that
     first if the fleet art changes. -->
<body><div class="card">
  <div class="brand"><span class="mark">GB</span><span class="word">Car Rental</span></div>
  <div class="art"><svg class="car-art" viewBox="0 0 800 400" fill="none" role="img" aria-labelledby="saga-art">
                    <title id="saga-art">Line drawing of a four-door sedan, side view</title>
                    <path class="ca-ground" d="M72 348 H740"/>
                    <path class="ca-body" pathLength="1" d="M70 288 C62 284 58 278 60 268 L60 238 C60 228 64 222 72 219 L116 202 C166 194 214 187 246 184 L348 108 C354 105 360 104 370 104 L546 104 C556 104 562 107 568 114 L628 180 L734 188 C746 189 754 197 756 210 C758 228 758 258 752 274 C748 281 742 288 734 288 L653 286 A66 66 0 0 0 523 286 L235 286 A66 66 0 0 0 105 286 Z"/>
                    <path class="ca-glass" d="M356 112 L432 112 L432 176 L265 176 Z"/>
                    <path class="ca-glass" d="M442 112 L504 112 L504 176 L442 176 Z"/>
                    <path class="ca-glass" d="M514 112 L556 112 L614 176 L514 176 Z"/>
                    <path class="ca-line" d="M262 180 L624 174"/>
                    <path class="ca-line" d="M508 178 V276"/>
                    <path class="ca-line" d="M452 196 h30"/>
                    <path class="ca-line" d="M516 194 h30"/>
                    <path class="ca-line" d="M256 254 H502"/>
                    <circle class="ca-tyre" cx="170" cy="292" r="56"/>
                    <circle class="ca-rim" cx="170" cy="292" r="28"/>
                    <circle class="ca-tyre" cx="588" cy="292" r="56"/>
                    <circle class="ca-rim" cx="588" cy="292" r="28"/>
                </svg></div>
  <div class="mid">
    <p class="eyebrow">E-hailing car rental &middot; Klang Valley</p>
    <h1>From <span class="rm">RM330</span><br>a week.</h1>
    <ul class="incl">
      <li>Zero insurance excess</li><li>PSV paid for</li><li>Servicing included</li>
    </ul>
  </div>
  <div class="foot"><span class="dom">gbcarservices.com</span><span>Open 8:30am &ndash; 5:30pm, daily</span></div>
</div></body></html>
