<!DOCTYPE html>
<html lang="en" data-theme="bluegrid">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Blue Grid</title>
    <link rel="icon" href="favicon-bluegrid.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon-bluegrid.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/bluegrid.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="login-brand">Blue Grid</div>
        <div class="login-tagline">Car Rental Management System</div>

        <h2>Sign in</h2>

        <div id="login-alert" class="alert alert-error" style="display:none;"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-id">Phone or email</label>
                <input id="login-id" type="text" autocomplete="username" required placeholder="012-3456789 or you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>
            </div>
            <button id="login-btn" type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <p class="login-hint">
            GB Car Rental drivers: enter your phone number, and your IC number
            as the password.
        </p>

        <a href="index.html" class="login-back">← Back to GB Car Rental</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        (async function () {
            // If already logged in, bounce straight to the right portal
            const profile = await getCurrentProfile();
            if (profile) {
                window.location.href = profile.role === 'admin' ? 'admin/index.html' : 'driver/index.html';
                return;
            }

            const form = document.getElementById('login-form');
            const alertBox = document.getElementById('login-alert');
            const btn = document.getElementById('login-btn');

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                alertBox.style.display = 'none';
                btn.disabled = true;
                btn.textContent = 'Signing in...';

                const loginId = document.getElementById('login-id').value.trim();
                const password = document.getElementById('password').value;

                const result = await signIn(loginId, password);

                if (result.error) {
                    alertBox.innerHTML = result.error
                        + (result.attemptedEmail ? '<br><span class="login-alert-note">tried email: ' + result.attemptedEmail + '</span>' : '');
                    alertBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign in';
                    return;
                }

                window.location.href = result.profile.role === 'admin'
                    ? 'admin/index.html'
                    : 'driver/index.html';
            });
        })();
    </script>
</body>
</html>
